<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rubish</title>
  <meta name="description" content="Turn a Rubik's cube into any letter or digit, step by step." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="app">
    <header id="title" class="title"></header>

    <div class="stage">
      <div id="cube" class="cube"></div>
      <div id="caption" class="caption" aria-live="polite"></div>
    </div>

    <div class="panel">
      <!-- Character entry: landing page, and again after each letter -->
      <section id="entry" class="entry slide">
        <form id="form" class="entry-row" autocomplete="off">
          <input id="char" class="char" maxlength="1" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="A" aria-label="Character, A to Z or 0 to 9" autofocus />
          <button id="go" class="go" type="submit" aria-label="Next">&gt;</button>
        </form>
        <div id="swatches" class="swatches" role="radiogroup" aria-label="Letter color"></div>
        <button id="finish" class="link" type="button">I'm done</button>
      </section>

      <!-- Step player: only the next-step button -->
      <section id="steps" class="steps" hidden>
        <button id="next" class="next" type="button"><kbd>space</kbd><span>next step</span></button>
      </section>
    </div>
  </main>

  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
