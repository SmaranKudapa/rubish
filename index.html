<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rubish</title>
  <meta name="description" content="Turn a Rubik's cube into any word, letter by letter." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
</head>
<body>
  <button id="ach-btn" class="corner-btn ach-btn" type="button" aria-label="Achievements" aria-haspopup="dialog"><img id="ach-btn-icon" alt="" /></button>
  <button id="mute" class="corner-btn mute" type="button" aria-label="Sound on"></button>

  <!-- Achievements menu -->
  <div id="ach-panel" class="ach-panel" role="dialog" aria-modal="true" aria-labelledby="ach-heading" hidden>
    <div class="ach-box">
      <div class="ach-head">
        <h2 id="ach-heading">ACHIEVEMENTS</h2>
        <span id="ach-count" class="ach-count"></span>
        <button id="ach-close" class="ach-close" type="button" aria-label="Close achievements">X</button>
      </div>
      <ul id="ach-list" class="ach-list"></ul>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <p id="press" class="press" aria-live="polite">CLICK OR PRESS ANY KEY</p>

  <main class="app">
    <header id="title" class="title"></header>

    <div class="stage">
      <div id="cube" class="cube" aria-label="Rubik's cube, drag to rotate"></div>
      <div id="flash" class="flash" aria-live="polite"></div>
      <div id="caption" class="caption" aria-live="polite"></div>
    </div>

    <div class="panel">
      <!-- Word entry: landing page, and again after each finished word -->
      <section id="entry" class="entry">
        <form id="form" class="entry-row" autocomplete="off">
          <input id="char" class="char" maxlength="12" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="TYPE HERE" aria-label="Word, letters A to Z" autofocus />
          <button id="go" class="go" type="submit" aria-label="Next">&gt;</button>
        </form>
        <div id="swatches" class="swatches" role="radiogroup" aria-label="Letter color"></div>
        <div id="swatches-bg" class="swatches" role="radiogroup" aria-label="Background color"></div>
      </section>

      <!-- Step player: only the next-step button -->
      <section id="steps" class="steps" hidden>
        <button id="next" class="next" type="button"><kbd>space</kbd><span>next step</span></button>
        <button id="skip" class="skip" type="button"><kbd>enter</kbd><span>to skip</span></button>
      </section>
    </div>
  </main>

  <canvas id="backdrop" class="backdrop" aria-hidden="true"></canvas>

  <!-- Physics pieces behind the main cube (negative depth) and in front of it -->
  <canvas id="physics-back" class="physics back" aria-hidden="true"></canvas>
  <canvas id="physics-front" class="physics front" aria-hidden="true"></canvas>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
